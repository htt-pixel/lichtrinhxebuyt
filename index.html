<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BusLine — Lịch trình xe buýt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#10232b;--bg:#eef1f2;--board:#0d3a40;--amber:#ffc72c;--line:#d5dcdf;--accent:#1b8a5a;--warn:#e8a317;--danger:#c8403a;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;gap:10px;align-items:center}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--amber);display:grid;place-items:center;font-style:normal;font-size:14px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.del{color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:13px}
main{max-width:1120px;margin:0 auto;padding:24px 20px 60px}
.board{background:var(--board);color:#fff;border-radius:14px;padding:20px 24px}
.board h2{font-size:14px;font-weight:500;opacity:.75;margin-bottom:10px}
.brow{display:grid;grid-template-columns:78px 54px 1fr auto;gap:14px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.12)}
.brow:first-of-type{border-top:0}
.btime{font-size:26px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums}
.bcode{background:#fff;color:var(--board);font-weight:700;border-radius:6px;text-align:center;padding:2px 0}
.bwait{font-variant-numeric:tabular-nums;opacity:.85}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{font-size:17px;margin-bottom:10px}
input[type=search],input[type=text],input[type=number],input[type=time],input[type=email],input[type=password],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rlist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.ritem{display:grid;grid-template-columns:44px 1fr;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;cursor:pointer}
.ritem.on{border-color:var(--accent);background:#f0faf5}
.ritem b.code{background:var(--board);color:#fff;border-radius:6px;text-align:center;align-self:start;padding:2px 0}
.ritem small{color:#5d6d74;display:block}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.times span{padding:3px 9px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.times span.next{background:var(--amber);font-weight:700}
.times span.x{text-decoration:line-through;opacity:.5}
.times span.late{background:#fde9bd}
ol.stops{margin:8px 0 0 4px;list-style:none;border-left:3px solid var(--accent);padding-left:16px}
ol.stops li{position:relative;padding:4px 0}
ol.stops li::before{content:"";position:absolute;left:-23px;top:11px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.muted{color:#5d6d74}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:#5d6d74}
.scroll{overflow-x:auto}
dialog{border:0;border-radius:14px;padding:22px;width:min(440px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(16,35,43,.5)}
dialog h3{margin-bottom:12px}
.f{margin-bottom:10px}.f label{display:block;font-size:13px;font-weight:500;margin-bottom:3px}
.f.chk label{display:flex;gap:8px;align-items:center}.f.chk input{width:auto}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9}
#toast div{background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px}
#toast div.err{background:var(--danger)}
.load{opacity:.5;pointer-events:none}
.warn{background:#fdf3d8;border:1px solid var(--warn);border-radius:10px;padding:12px 16px;margin-bottom:16px}
@media(max-width:820px){
 header{padding:12px 16px}.grid{grid-template-columns:1fr}.rlist{max-height:none}
 .brow{grid-template-columns:64px 44px 1fr}.bwait{grid-column:2/4}
 .rtable thead{display:none}
 .rtable tr{display:block;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
 .rtable td{display:flex;justify-content:space-between;border:0;white-space:normal}
 .rtable td::before{content:attr(data-l);color:#5d6d74}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><i>B</i>BusLine</div>
  <div id="auth"></div>
</header>
<main>
  <div id="cfgWarn" class="warn" hidden>Chưa kết nối cơ sở dữ liệu. Mở <b>index.html</b> và điền <code>SUPABASE_URL</code>, <code>SUPABASE_ANON_KEY</code> ở đầu phần script.</div>
  <div id="pub">
    <section class="board"><h2>Sắp xuất bến · <span id="clock"></span> (giờ Việt Nam)</h2><div id="board"></div></section>
    <div class="grid">
      <section class="panel">
        <h3>Tra cứu tuyến</h3>
        <input type="search" id="q" placeholder="Số tuyến hoặc tên điểm dừng" aria-label="Tìm tuyến">
        <div class="seg" id="dir"><button data-d="" class="on">Tất cả</button><button data-d="di">Lượt đi</button><button data-d="ve">Lượt về</button></div>
        <div class="rlist" id="rlist"></div>
      </section>
      <section class="panel" id="detail"></section>
    </div>
  </div>
  <div id="adm" hidden>
    <div class="tabs" id="tabs"></div>
    <section class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 id="atitle"></h3><button class="btn pri" id="addBtn">Thêm mới</button></div><div class="scroll" id="atable"></div></section>
  </div>
</main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://mrupcaiwswcpdmsvwsdr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ydXBjYWl3c3djcGRtc3Z3c2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNTMyNDIsImV4cCI6MjEwOTYyOTI0Mn0.NHYqiE4MNzfAGMvhRk1FmST7k9cjtuaqx19pS5sNoUs';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t5 = v => v ? String(v).slice(0, 5) : '';
const toMin = t => { const [h, m] = t5(t).split(':'); return +h * 60 + +m; };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
const DIR = { di: 'Lượt đi', ve: 'Lượt về' };
const STATUS = { scheduled: 'Đúng giờ', delayed: 'Trễ', cancelled: 'Huỷ', done: 'Đã chạy' };

const ok = !SUPABASE_URL.includes('YOUR-');
const sb = ok ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const S = { routes: [], stops: [], trips: [], buses: [], sel: null, dir: '', q: '', tab: 'routes', user: null };
const isAdmin = () => S.user?.app_metadata?.role === 'admin';

function toast(msg, err) {
  const d = document.createElement('div'); d.textContent = msg; if (err) d.className = 'err';
  $('#toast').append(d); setTimeout(() => d.remove(), 3800);
}
function nowMin() {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
  const g = t => +p.find(x => x.type === t).value;
  return (g('hour') % 24) * 60 + g('minute');
}
const clockStr = () => { const n = nowMin(); return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); };

/* ---------- Tải dữ liệu ---------- */
async function load() {
  if (!ok) { $('#cfgWarn').hidden = false; render(); return; }
  document.body.classList.add('load');
  try {
    const [r, s, t, b] = await Promise.all([
      sb.from('routes').select('*').order('code'),
      sb.from('stops').select('*').order('seq'),
      sb.from('trips').select('*').order('departure'),
      sb.from('buses').select('*').order('plate')
    ]);
    for (const x of [r, s, t, b]) if (x.error) throw x.error;
    Object.assign(S, { routes: r.data, stops: s.data, trips: t.data, buses: b.data });
    if (!S.sel || !S.routes.find(x => x.id === S.sel)) S.sel = S.routes[0]?.id ?? null;
  } catch (e) { toast('Không tải được dữ liệu: ' + (e.message || e), true); }
  document.body.classList.remove('load');
  render();
}

/* ---------- Chế độ công khai ---------- */
function renderBoard() {
  const n = nowMin(), rt = id => S.routes.find(r => r.id === id);
  let list = S.trips.filter(t => t.status !== 'cancelled' && rt(t.route_id)?.active && toMin(t.departure) >= n);
  let tomorrow = false;
  if (!list.length) { list = S.trips.filter(t => t.status !== 'cancelled' && rt(t.route_id)?.active); tomorrow = true; }
  list = list.sort((a, b) => toMin(a.departure) - toMin(b.departure)).slice(0, 6);
  $('#board').innerHTML = list.length ? list.map(t => {
    const r = rt(t.route_id), w = toMin(t.departure) - n;
    return `<div class="brow"><span class="btime">${t5(t.departure)}</span><span class="bcode">${esc(r.code)}</span>
      <span>${esc(t.direction === 'di' ? r.end_point : r.start_point)}${t.status === 'delayed' ? ' · <b style="color:var(--amber)">trễ</b>' : ''}</span>
      <span class="bwait">${tomorrow ? 'Sáng mai' : w === 0 ? 'Đang xuất bến' : 'Còn ' + w + ' phút'}</span></div>`;
  }).join('') : '<p style="opacity:.7">Chưa có chuyến nào.</p>';
  $('#clock').textContent = clockStr();
}
function routeMatch(r) {
  const q = norm(S.q);
  if (S.dir && !S.trips.some(t => t.route_id === r.id && t.direction === S.dir)) return false;
  if (!q) return true;
  return norm(r.code).includes(q) || norm(r.name).includes(q) || S.stops.some(s => s.route_id === r.id && norm(s.name).includes(q));
}
function renderList() {
  const rs = S.routes.filter(r => r.active && routeMatch(r));
  $('#rlist').innerHTML = rs.length ? rs.map(r => `<button class="ritem ${r.id === S.sel ? 'on' : ''}" data-id="${r.id}">
    <b class="code">${esc(r.code)}</b><span>${esc(r.start_point)} – ${esc(r.end_point)}<small>${t5(r.first_trip)}–${t5(r.last_trip)} · mỗi ${r.interval_min} phút</small></span></button>`).join('')
    : '<p class="muted">Không tìm thấy tuyến phù hợp. Thử số tuyến hoặc tên một điểm dừng khác.</p>';
}
function renderDetail() {
  const r = S.routes.find(x => x.id === S.sel), el = $('#detail');
  if (!r) { el.innerHTML = '<p class="muted">Chọn một tuyến để xem điểm dừng và giờ xuất bến.</p>'; return; }
  const n = nowMin();
  const dirs = S.dir ? [S.dir] : ['di', 've'];
  const block = d => {
    const ts = S.trips.filter(t => t.route_id === r.id && t.direction === d);
    const next = ts.find(t => toMin(t.departure) >= n && t.status !== 'cancelled');
    return `<h3 style="margin-top:18px">${DIR[d]}</h3><div class="times">${ts.length ? ts.map(t =>
      `<span class="${t === next ? 'next' : ''} ${t.status === 'cancelled' ? 'x' : t.status === 'delayed' ? 'late' : ''}" title="${STATUS[t.status]}">${t5(t.departure)}</span>`).join('') : '<span class="muted">Chưa có chuyến</span>'}</div>`;
  };
  const st = S.stops.filter(s => s.route_id === r.id).sort((a, b) => a.seq - b.seq);
  el.innerHTML = `<h3>Tuyến ${esc(r.code)}: ${esc(r.name)}</h3>
    <p class="muted">Chuyến đầu ${t5(r.first_trip)} · chuyến cuối ${t5(r.last_trip)} · giãn cách ${r.interval_min} phút</p>
    <h3 style="margin-top:18px">Điểm dừng</h3>
    ${st.length ? '<ol class="stops">' + st.map(s => `<li>${esc(s.name)}</li>`).join('') + '</ol>' : '<p class="muted">Chưa có điểm dừng.</p>'}
    ${dirs.map(block).join('')}
    <p class="muted" style="margin-top:12px;font-size:13px">Ô vàng là chuyến tiếp theo. Gạch ngang: chuyến bị huỷ. Nền cam: chuyến trễ.</p>`;
}

/* ---------- Chế độ quản trị ---------- */
const CFG = {
  routes: { label: 'Tuyến', f: [
    { k: 'code', l: 'Mã tuyến', t: 'text' }, { k: 'name', l: 'Tên tuyến', t: 'text' },
    { k: 'start_point', l: 'Điểm đầu', t: 'text' }, { k: 'end_point', l: 'Điểm cuối', t: 'text' },
    { k: 'first_trip', l: 'Chuyến đầu', t: 'time' }, { k: 'last_trip', l: 'Chuyến cuối', t: 'time' },
    { k: 'interval_min', l: 'Giãn cách (phút)', t: 'number' }, { k: 'active', l: 'Đang hoạt động', t: 'check' }] },
  stops: { label: 'Điểm dừng', f: [
    { k: 'route_id', l: 'Tuyến', t: 'select', src: 'routes', show: 'code' }, { k: 'seq', l: 'Thứ tự', t: 'number' },
    { k: 'name', l: 'Tên điểm dừng', t: 'text' }, { k: 'lat', l: 'Vĩ độ', t: 'number', opt: 1 }, { k: 'lng', l: 'Kinh độ', t: 'number', opt: 1 }] },
  trips: { label: 'Chuyến', f: [
    { k: 'route_id', l: 'Tuyến', t: 'select', src: 'routes', show: 'code' }, { k: 'departure', l: 'Giờ xuất bến', t: 'time' },
    { k: 'bus_id', l: 'Xe', t: 'select', src: 'buses', show: 'plate', opt: 1 },
    { k: 'direction', l: 'Hướng', t: 'select', list: DIR }, { k: 'status', l: 'Trạng thái', t: 'select', list: STATUS }] },
  buses: { label: 'Xe', f: [
    { k: 'plate', l: 'Biển số', t: 'text' }, { k: 'capacity', l: 'Sức chứa', t: 'number' },
    { k: 'status', l: 'Tình trạng', t: 'select', list: { active: 'Hoạt động', maintenance: 'Bảo dưỡng', retired: 'Ngừng' } }] }
};
const cell = (f, v) => f.t === 'check' ? (v ? '✓' : '') : f.t === 'time' ? t5(v) :
  f.src ? esc(S[f.src].find(x => x.id === v)?.[f.show] ?? '') : f.list ? esc(f.list[v] ?? v) : esc(v ?? '');

function renderAdmin() {
  const c = CFG[S.tab];
  $('#tabs').innerHTML = Object.entries(CFG).map(([k, v]) => `<button data-t="${k}" class="${k === S.tab ? 'on' : ''}">${v.label}</button>`).join('');
  $('#atitle').textContent = 'Quản lý ' + c.label.toLowerCase();
  let rows = [...S[S.tab]];
  if (S.tab === 'stops') rows.sort((a, b) => a.route_id - b.route_id || a.seq - b.seq);
  $('#atable').innerHTML = `<table class="rtable"><thead><tr>${c.f.map(f => `<th>${f.l}</th>`).join('')}<th></th></tr></thead><tbody>` +
    rows.map(r => `<tr>${c.f.map(f => `<td data-l="${f.l}">${cell(f, r[f.k])}</td>`).join('')}<td>
      ${S.tab === 'stops' ? `<button class="btn sm" data-mv="-1" data-id="${r.id}" aria-label="Lên">↑</button> <button class="btn sm" data-mv="1" data-id="${r.id}" aria-label="Xuống">↓</button> ` : ''}
      <button class="btn sm" data-edit="${r.id}">Sửa</button> <button class="btn sm del" data-del="${r.id}">Xoá</button></td></tr>`).join('') +
    '</tbody></table>' + (rows.length ? '' : '<p class="muted" style="padding:12px 0">Chưa có dữ liệu. Chọn “Thêm mới” để bắt đầu.</p>');
}
function openForm(row) {
  const c = CFG[S.tab], d = $('#dlg');
  d.innerHTML = `<form method="dialog" id="frm"><h3>${row ? 'Sửa' : 'Thêm'} ${c.label.toLowerCase()}</h3>` + c.f.map(f => {
    const v = row ? row[f.k] : (f.t === 'check' ? true : '');
    if (f.t === 'check') return `<div class="f chk"><label><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}>${f.l}</label></div>`;
    if (f.t === 'select') {
      const o = f.src ? S[f.src].map(x => [x.id, x[f.show]]) : Object.entries(f.list);
      return `<div class="f"><label>${f.l}</label><select name="${f.k}" ${f.opt ? '' : 'required'}>${f.opt ? '<option value="">—</option>' : ''}${o.map(([k, l]) => `<option value="${esc(k)}" ${String(k) === String(v) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></div>`;
    }
    return `<div class="f"><label>${f.l}</label><input type="${f.t}" name="${f.k}" value="${esc(f.t === 'time' ? t5(v) : v)}" ${f.opt ? '' : 'required'} ${f.t === 'number' ? 'step="any"' : ''}></div>`;
  }).join('') + `<div class="acts"><button type="button" class="btn" id="cancel">Huỷ</button><button class="btn pri" value="save">Lưu</button></div></form>`;
  d.showModal();
  $('#cancel').onclick = () => d.close();
  $('#frm').onsubmit = async e => { e.preventDefault(); await save(row); };
}
async function save(row) {
  const c = CFG[S.tab], fd = new FormData($('#frm')), o = {};
  for (const f of c.f) {
    const v = fd.get(f.k);
    o[f.k] = f.t === 'check' ? fd.has(f.k) : (v === '' || v === null) ? null : f.t === 'number' || f.k.endsWith('_id') ? +v : v;
  }
  const other = S[S.tab].filter(x => !row || x.id !== row.id);
  if (S.tab === 'routes' && o.last_trip <= o.first_trip) return toast('Chuyến cuối phải sau chuyến đầu.', true);
  if (S.tab === 'trips' && o.bus_id && other.some(t => t.bus_id === o.bus_id && t5(t.departure) === o.departure)) return toast('Xe này đã có chuyến xuất bến cùng giờ.', true);
  try {
    const q = row ? sb.from(S.tab).update(o).eq('id', row.id) : sb.from(S.tab).insert(o);
    const { error } = await q; if (error) throw error;
    $('#dlg').close(); toast('Đã lưu.'); load();
  } catch (e) { toast('Lưu thất bại: ' + (e.message || e), true); }
}
function confirmDel(row) {
  const d = $('#dlg');
  d.innerHTML = `<h3>Xoá bản ghi này?</h3><p class="muted">Thao tác không thể hoàn tác${S.tab === 'routes' ? '. Điểm dừng và chuyến của tuyến cũng bị xoá' : ''}.</p>
    <div class="acts"><button class="btn" id="cancel">Giữ lại</button><button class="btn pri" id="yes" style="background:var(--danger);border-color:var(--danger)">Xoá</button></div>`;
  d.showModal(); $('#cancel').onclick = () => d.close();
  $('#yes').onclick = async () => {
    const { error } = await sb.from(S.tab).delete().eq('id', row.id);
    d.close(); error ? toast('Xoá thất bại: ' + error.message, true) : (toast('Đã xoá.'), load());
  };
}
async function move(id, dlt) {
  const s = S.stops.find(x => x.id === id);
  const sib = S.stops.filter(x => x.route_id === s.route_id).sort((a, b) => a.seq - b.seq), o = sib[sib.indexOf(s) + dlt];
  if (!o) return;
  try {
    const a = await sb.from('stops').update({ seq: o.seq }).eq('id', s.id);
    const b = await sb.from('stops').update({ seq: s.seq }).eq('id', o.id);
    if (a.error || b.error) throw (a.error || b.error);
    load();
  } catch (e) { toast('Không đổi được thứ tự: ' + e.message, true); }
}

/* ---------- Đăng nhập ---------- */
function renderAuth() {
  $('#auth').innerHTML = S.user
    ? `${isAdmin() ? '<button class="btn" id="toggle">' + (location.hash === '#admin' ? 'Xem công khai' : 'Quản trị') + '</button> ' : ''}<button class="btn" id="out">Đăng xuất</button>`
    : '<button class="btn" id="in">Quản trị viên</button>';
  const v = S.user && isAdmin() && location.hash === '#admin';
  $('#pub').hidden = v; $('#adm').hidden = !v;
}
function openLogin() {
  const d = $('#dlg');
  d.innerHTML = `<form id="lf"><h3>Đăng nhập quản trị</h3>
    <div class="f"><label>Email</label><input type="email" name="e" required autocomplete="username"></div>
    <div class="f"><label>Mật khẩu</label><input type="password" name="p" required autocomplete="current-password"></div>
    <div class="acts"><button type="button" class="btn" id="cancel">Huỷ</button><button class="btn pri">Đăng nhập</button></div></form>`;
  d.showModal(); $('#cancel').onclick = () => d.close();
  $('#lf').onsubmit = async e => {
    e.preventDefault(); const f = new FormData(e.target);
    const { data, error } = await sb.auth.signInWithPassword({ email: f.get('e'), password: f.get('p') });
    if (error) return toast('Đăng nhập thất bại: sai email hoặc mật khẩu.', true);
    d.close();
    if (data.user?.app_metadata?.role !== 'admin') toast('Tài khoản này chưa có quyền quản trị, chỉ xem được dữ liệu.', true);
    else location.hash = '#admin';
  };
}

/* ---------- Sự kiện ---------- */
function render() { renderAuth(); renderBoard(); renderList(); renderDetail(); if (!$('#adm').hidden) renderAdmin(); }
$('#q').oninput = e => { S.q = e.target.value; renderList(); };
$('#dir').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.dir = b.dataset.d; [...$('#dir').children].forEach(x => x.classList.toggle('on', x === b)); renderList(); renderDetail(); };
$('#rlist').onclick = e => { const b = e.target.closest('.ritem'); if (b) { S.sel = +b.dataset.id; renderList(); renderDetail(); } };
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) { S.tab = b.dataset.t; renderAdmin(); } };
$('#addBtn').onclick = () => openForm(null);
$('#atable').onclick = e => {
  const t = e.target.closest('button'); if (!t) return;
  const find = id => S[S.tab].find(x => x.id === +id);
  if (t.dataset.edit) openForm(find(t.dataset.edit));
  else if (t.dataset.del) confirmDel(find(t.dataset.del));
  else if (t.dataset.mv) move(+t.dataset.id, +t.dataset.mv);
};
$('#auth').onclick = async e => {
  const id = e.target.id;
  if (id === 'in') ok ? openLogin() : toast('Chưa cấu hình Supabase.', true);
  if (id === 'out') { await sb.auth.signOut(); location.hash = ''; }
  if (id === 'toggle') location.hash = location.hash === '#admin' ? '' : '#admin';
};
addEventListener('hashchange', render);
setInterval(() => { if (!$('#pub').hidden) renderBoard(); }, 30000);

if (ok) {
  sb.auth.getSession().then(({ data }) => { S.user = data.session?.user ?? null; render(); });
  sb.auth.onAuthStateChange((_, s) => { S.user = s?.user ?? null; render(); });
  sb.channel('trips-live').on('postgres_changes', { event: '*', schema: 'public', table: 'trips' }, load).subscribe();
}
load();
</script>
</body>
</html>
