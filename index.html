<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BusLine — Lịch trình xe buýt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--ink:#10232b;--bg:#eef1f2;--board:#0d3a40;--amber:#ffc72c;--line:#d5dcdf;--accent:#1b8a5a;--warn:#e8a317;--danger:#c8403a;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em;display:flex;gap:10px;align-items:center}
.brand i{width:26px;height:26px;border-radius:7px;background:var(--amber);display:grid;place-items:center;font-style:normal;font-size:14px}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.del{color:var(--danger)}
.btn.sm{padding:3px 9px;font-size:13px}
main{max-width:1120px;margin:0 auto;padding:24px 20px 60px}
.board{background:var(--board);color:#fff;border-radius:14px;padding:20px 24px}
.board h2{font-size:14px;font-weight:500;opacity:.75;margin-bottom:10px}
.brow{display:grid;grid-template-columns:78px 54px 1fr auto;gap:14px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.12)}
.brow:first-of-type{border-top:0}
.btime{font-size:26px;font-weight:600;color:var(--amber);font-variant-numeric:tabular-nums}
.bcode{background:#fff;color:var(--board);font-weight:700;border-radius:6px;text-align:center;padding:2px 0}
.bwait{font-variant-numeric:tabular-nums;opacity:.85}
.grid{display:grid;grid-template-columns:340px 1fr;gap:20px;margin-top:22px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.panel h3{font-size:17px;margin-bottom:10px}
input[type=search],input[type=text],input[type=number],input[type=time],input[type=email],input[type=password],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rlist{display:flex;flex-direction:column;gap:6px;max-height:68vh;overflow:auto}
.ritem{display:grid;grid-template-columns:44px 1fr;gap:10px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;cursor:pointer}
.ritem.on{border-color:var(--accent);background:#f0faf5}
.ritem b.code{background:var(--board);color:#fff;border-radius:6px;text-align:center;align-self:start;padding:2px 0}
.ritem small{color:#5d6d74;display:block}
.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.times span{padding:3px 9px;border-radius:6px;background:var(--bg);font-variant-numeric:tabular-nums}
.times span.next{background:var(--amber);font-weight:700}
.times span.x{text-decoration:line-through;opacity:.5}
.times span.late{background:#fde9bd}
ol.stops{margin:8px 0 0 4px;list-style:none;border-left:3px solid var(--accent);padding-left:16px}
ol.stops li{position:relative;padding:4px 0}
ol.stops li::before{content:"";position:absolute;left:-23px;top:11px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.muted{color:#5d6d74}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.tabs button.on{background:var(--ink);color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-weight:600;color:#5d6d74}
.scroll{overflow-x:auto}
dialog{border:0;border-radius:14px;padding:22px;width:min(440px,92vw);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(16,35,43,.5)}
dialog h3{margin-bottom:12px}
.f{margin-bottom:10px}.f label{display:block;font-size:13px;font-weight:500;margin-bottom:3px}
.f.chk label{display:flex;gap:8px;align-items:center}.f.chk input{width:auto}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:9}
#toast div{background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px}
#toast div.err{background:var(--danger)}
.load{opacity:.5;pointer-events:none}
.warn{background:#fdf3d8;border:1px solid var(--warn);border-radius:10px;padding:12px 16px;margin-bottom:16px}
#map{height:340px;border-radius:10px;margin-top:14px;z-index:0;background:#dde3e5}
#pick{height:220px;border-radius:8px;z-index:0;margin-bottom:6px}
.pin{width:24px;height:24px;border-radius:50%;background:var(--amber);color:var(--ink);font:700 12px/1 "Be Vietnam Pro",sans-serif;display:grid;place-items:center;border:2px solid var(--board)}
.brand{cursor:pointer}
.tag{background:var(--amber);border-radius:6px;padding:1px 8px;font-size:12px;margin-left:8px;font-weight:600;vertical-align:middle}
.times small{opacity:.7}
ol.stops small{margin-left:6px}
@media(max-width:820px){
 header{padding:12px 16px}.grid{grid-template-columns:1fr}.rlist{max-height:none}
 .brow{grid-template-columns:64px 44px 1fr}.bwait{grid-column:2/4}
 .rtable thead{display:none}
 .rtable tr{display:block;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
 .rtable td{display:flex;justify-content:space-between;border:0;white-space:normal}
 .rtable td::before{content:attr(data-l);color:#5d6d74}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><i>B</i>BusLine</div>
  <div id="auth"></div>
</header>
<main>
  <div id="cfgWarn" class="warn" hidden>Chưa kết nối cơ sở dữ liệu. Mở <b>index.html</b> và điền <code>SUPABASE_URL</code>, <code>SUPABASE_ANON_KEY</code> ở đầu phần script.</div>
  <div id="pub">
    <section class="board"><h2>Sắp xuất bến · <span id="clock"></span> (giờ Việt Nam)</h2><div id="board"></div></section>
    <div class="grid">
      <section class="panel">
        <h3>Tra cứu tuyến</h3>
        <input type="search" id="q" placeholder="Số tuyến hoặc tên điểm dừng" aria-label="Tìm tuyến">
        <div class="seg" id="dir"><button data-d="" class="on">Tất cả</button><button data-d="di">Lượt đi</button><button data-d="ve">Lượt về</button></div>
        <div class="seg" id="typ" style="margin-top:0"><button data-t="" class="on">Mọi loại xe</button><button data-t="fixed">Dừng cố định</button><button data-t="flag_down">Đón dọc đường</button></div>
        <div class="rlist" id="rlist"></div>
      </section>
      <section class="panel" id="detail"></section>
    </div>
  </div>
  <div id="adm" hidden>
    <div class="tabs" id="tabs"></div>
    <section class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 id="atitle"></h3><button class="btn pri" id="addBtn">Thêm mới</button></div><div class="scroll" id="atable"></div></section>
  </div>
<div id="me" hidden></div>
</main>
<dialog id="dlg"></dialog>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPABASE_URL = 'https://mrupcaiwswcpdmsvwsdr.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1ydXBjYWl3c3djcGRtc3Z3c2RyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQwNTMyNDIsImV4cCI6MjEwOTYyOTI0Mn0.NHYqiE4MNzfAGMvhRk1FmST7k9cjtuaqx19pS5sNoUs';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t5 = v => v ? String(v).slice(0, 5) : '';
const toMin = t => { const [h, m] = t5(t).split(':'); return +h * 60 + +m; };
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd');
const PHONE = /^\+?[0-9 ]{8,15}$/;
const PM = { cash: 'Tiền mặt', transfer: 'Chuyển khoản', ewallet: 'Ví điện tử' }, PAY = { unpaid: 'Chưa thanh toán', paid: 'Đã thanh toán' };
const DIR = { di: 'Lượt đi', ve: 'Lượt về' };
const STATUS = { scheduled: 'Đúng giờ', delayed: 'Trễ', cancelled: 'Huỷ', done: 'Đã chạy' };

const ok = !SUPABASE_URL.includes('YOUR-');
const sb = ok ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const S = { routes: [], stops: [], trips: [], buses: [], profiles: [], bookings: [], me: null, sel: null, dir: '', type: '', q: '', tab: 'routes', user: null };
const isAdmin = () => S.user?.app_metadata?.role === 'admin';

function toast(msg, err) {
  const d = document.createElement('div'); d.textContent = msg; if (err) d.className = 'err';
  $('#toast').append(d); setTimeout(() => d.remove(), 3800);
}
function nowMin() {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Ho_Chi_Minh', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(new Date());
  const g = t => +p.find(x => x.type === t).value;
  return (g('hour') % 24) * 60 + g('minute');
}
const clockStr = () => { const n = nowMin(); return String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0'); };

/* ---------- Tải dữ liệu ---------- */
async function load() {
  if (!ok) { $('#cfgWarn').hidden = false; render(); return; }
  document.body.classList.add('load');
  try {
    const u = S.user;
    const [r, s, t, b, pr, me, bk] = await Promise.all([
      sb.from('routes').select('*').order('code'),
      sb.from('stops').select('*').order('seq'),
      sb.from('trips').select('*').order('departure'),
      sb.from('buses').select('*').order('plate'),
      u && isAdmin() ? sb.from('profiles').select('*').order('full_name') : { data: [] },
      u ? sb.from('profiles').select('*').eq('id', u.id).maybeSingle() : { data: null },
      u ? sb.from('bookings').select('*').order('created_at', { ascending: false }) : { data: [] }
    ]);
    for (const x of [r, s, t, b, pr, me, bk]) if (x.error) throw x.error;
    Object.assign(S, { routes: r.data, stops: s.data, trips: t.data, buses: b.data, profiles: pr.data, me: me.data, bookings: bk.data });
    if (!S.sel || !S.routes.find(x => x.id === S.sel)) S.sel = S.routes[0]?.id ?? null;
  } catch (e) { toast('Không tải được dữ liệu: ' + (e.message || e), true); }
  document.body.classList.remove('load');
  render();
}

/* ---------- Chế độ công khai ---------- */
const money = n => Number(n).toLocaleString('vi-VN') + ' đ';
const eff = t => toMin(t.departure) + (t.delay_min || 0);
const isFlag = r => r.service_type === 'flag_down';
const hav = (a, b, c, d) => { const q = x => x * Math.PI / 180, u = Math.sin(q(c - a) / 2) ** 2 + Math.cos(q(a)) * Math.cos(q(c)) * Math.sin(q(d - b) / 2) ** 2; return 12742 * Math.asin(Math.sqrt(u)); };
const fareOf = (r, seats, from, al) => isFlag(r) ? Math.round((r.base_fare + r.per_km * hav(from.lat, from.lng, al.lat, al.lng) * 1.3) / 500) * 500 * seats : r.base_fare * seats;
const fareText = r => isFlag(r) ? `${money(r.base_fare)} + ${money(r.per_km)}/km` : `${money(r.base_fare)}/lượt`;
const hhmm = m => String(Math.floor(m / 60) % 24).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
const stopsOf = id => S.stops.filter(s => s.route_id === id).sort((a, b) => a.seq - b.seq);
const plateOf = id => S.buses.find(b => b.id === id)?.plate || 'chưa gán xe';

function renderBoard() {
  const n = nowMin(), rt = id => S.routes.find(r => r.id === id);
  const live = t => t.status !== 'cancelled' && rt(t.route_id)?.active;
  let list = S.trips.filter(t => live(t) && eff(t) >= n), tomorrow = false;
  if (!list.length) { list = S.trips.filter(live); tomorrow = true; }
  list = list.sort((a, b) => eff(a) - eff(b)).slice(0, 6);
  $('#board').innerHTML = list.length ? list.map(t => {
    const r = rt(t.route_id), w = eff(t) - n;
    return `<div class="brow"><span class="btime">${t5(t.departure)}</span><span class="bcode">${esc(r.code)}</span>
      <span>${esc(t.direction === 'di' ? r.end_point : r.start_point)}${isFlag(r) ? ' <span class="tag" style="color:var(--ink)">Đón dọc đường</span>' : ''}${t.delay_min >= 3 ? ` · <b style="color:var(--amber)">trễ ${t.delay_min} phút</b>` : ''}</span>
      <span class="bwait">${tomorrow ? 'Sáng mai' : w <= 0 ? 'Đang xuất bến' : 'Còn ' + w + ' phút'}</span></div>`;
  }).join('') : '<p style="opacity:.7">Chưa có chuyến nào.</p>';
  $('#clock').textContent = hhmm(n);
}
function routeMatch(r) {
  const q = norm(S.q);
  if (S.type && r.service_type !== S.type) return false;
  if (S.dir && !S.trips.some(t => t.route_id === r.id && t.direction === S.dir)) return false;
  if (!q) return true;
  return norm(r.code).includes(q) || norm(r.name).includes(q) || S.stops.some(s => s.route_id === r.id && norm(s.name).includes(q));
}
function renderList() {
  const rs = S.routes.filter(r => r.active && routeMatch(r));
  $('#rlist').innerHTML = rs.length ? `<p class="muted" style="font-size:13px">${rs.length} tuyến</p>` + rs.map(r => `<button class="ritem ${r.id === S.sel ? 'on' : ''}" data-id="${r.id}">
    <b class="code">${esc(r.code)}</b><span>${esc(r.start_point)} – ${esc(r.end_point)}<small>${isFlag(r) ? 'Đón dọc đường · ' : ''}${fareText(r)} · mỗi ${r.interval_min} phút</small></span></button>`).join('')
    : '<p class="muted">Không tìm thấy tuyến phù hợp. Thử số tuyến hoặc tên một điểm dừng khác.</p>';
}
function renderDetail() {
  const r = S.routes.find(x => x.id === S.sel), el = $('#detail');
  if (!r) { el.innerHTML = '<p class="muted">Chọn một tuyến để xem điểm dừng và giờ xuất bến.</p>'; return; }
  const n = nowMin(), dirs = S.dir ? [S.dir] : ['di', 've'], st = stopsOf(r.id), tot = st.length ? st[st.length - 1].offset_min : 0;
  const block = d => {
    const ts = S.trips.filter(t => t.route_id === r.id && t.direction === d);
    const next = ts.find(t => eff(t) >= n && t.status !== 'cancelled');
    return `<h3 style="margin-top:18px">${DIR[d]}</h3><div class="times">${ts.length ? ts.map(t =>
      `<span class="${t === next ? 'next' : ''} ${t.status === 'cancelled' ? 'x' : t.delay_min >= 5 ? 'late' : ''}" title="${STATUS[t.status]}${t.delay_min ? ' · trễ ' + t.delay_min + ' phút' : ''}">${t5(t.departure)}${t.delay_min >= 3 ? ` <small>+${t.delay_min}</small>` : ''}</span>`).join('') : '<span class="muted">Chưa có chuyến</span>'}</div>`;
  };
  el.innerHTML = `<h3>Tuyến ${esc(r.code)}: ${esc(r.name)}${isFlag(r) ? '<span class="tag">Đón dọc đường</span>' : ''}</h3>
    <p class="muted">Chuyến đầu ${t5(r.first_trip)} · chuyến cuối ${t5(r.last_trip)} · giãn cách ${r.interval_min} phút · hành trình khoảng ${tot} phút</p>
    <p style="margin:6px 0 10px"><b>Giá vé: ${fareText(r)}</b>${isFlag(r) ? '<br><span class="muted" style="font-size:13px">Vẫy xe ở bất kỳ điểm nào dọc tuyến. Giá = giá cơ bản + giá theo km từ điểm đón đến điểm trả.</span>' : ''}</p>
    <button class="btn pri" id="bookBtn">Đặt chỗ / đăng ký đi tuyến này</button>
    <div id="map"></div>
    <h3 style="margin-top:18px">Điểm dừng${isFlag(r) ? ' tham chiếu' : ''}</h3>
    ${st.length ? '<ol class="stops">' + st.map(s => `<li data-sid="${s.id}" style="cursor:pointer">${esc(s.name)}<small class="muted">+${s.offset_min} phút</small></li>`).join('') + '</ol>' : '<p class="muted">Chưa có điểm dừng.</p>'}
    ${dirs.map(block).join('')}
    <p class="muted" style="margin-top:12px;font-size:13px">Ô vàng: chuyến tiếp theo. Số nhỏ +N: phút trễ dự kiến. Gạch ngang: chuyến bị huỷ.</p>`;
  drawMap(st);
}

/* ---------- Đặt chỗ ---------- */
function openBook() {
  const r = S.routes.find(x => x.id === S.sel); if (!r) return;
  const n = nowMin(), flag = isFlag(r), st = stopsOf(r.id), tot = st.length ? st[st.length - 1].offset_min : 0, d = $('#dlg');
  let ts = S.trips.filter(t => t.route_id === r.id && t.status !== 'cancelled' && t.status !== 'done').sort((a, b) => eff(a) - eff(b));
  const up = ts.filter(t => eff(t) >= n); if (up.length) ts = up;
  ts = ts.slice(0, 60);
  if (!ts.length || st.length < 2) return toast('Tuyến này chưa có chuyến hoặc điểm dừng để đặt.', true);
  const so = st.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('');
  const gs = guestSaved();
  d.innerHTML = `<form id="bf"><h3>Đăng ký đi tuyến ${esc(r.code)}</h3>
    <p class="muted" style="margin-bottom:10px">${esc(r.name)} · ${fareText(r)}</p>
    ${S.user ? `<p class="muted" style="margin-bottom:8px">Đặt chỗ bằng tài khoản ${esc(S.me?.full_name || S.user.email)}.</p>` : `<div class="f"><label>Họ và tên</label><input type="text" name="gname" required maxlength="80" value="${esc(gs.name)}" autocomplete="name"></div>
    <div class="f"><label>Số điện thoại</label><input type="text" name="gphone" required inputmode="tel" value="${esc(gs.phone)}" placeholder="0901234567" autocomplete="tel"></div>
    <div class="f chk"><label><input type="checkbox" name="remember" checked>Nhớ thông tin trên thiết bị này</label></div>
    <p class="muted" style="font-size:13px;margin-bottom:8px">Không cần tài khoản hay email. Bạn nhận một mã đặt chỗ để tra cứu bằng số điện thoại.</p>`}
    <div class="f"><label>Chuyến và xe</label><select name="trip" required>${ts.map(t => `<option value="${t.id}">${t5(t.departure)}${t.delay_min >= 3 ? ' (trễ ' + t.delay_min + ' phút)' : ''} · ${DIR[t.direction]} · xe ${esc(plateOf(t.bus_id))}</option>`).join('')}</select></div>
    ${flag ? `<div class="f"><label>Điểm đón: bấm bản đồ hoặc dùng vị trí của bạn</label>
      <input type="text" name="plat" readonly required placeholder="Vĩ độ"><input type="text" name="plng" readonly required placeholder="Kinh độ" style="margin-top:4px">
      <button type="button" class="btn sm" id="geo" style="margin-top:6px">Dùng vị trí của tôi</button></div>`
      : `<div class="f"><label>Điểm lên xe</label><select name="from">${so}</select></div>`}
    <div class="f"><label>Điểm xuống xe</label><select name="to">${so}</select></div>
    <div class="f"><label>Số ghế (tối đa 5)</label><input type="number" name="seats" min="1" max="5" value="1" required></div>
    <div class="f"><label>Hình thức thanh toán</label><select name="pay">${Object.entries(PM).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></div>
    <div class="f"><label>Ghi chú (không bắt buộc)</label><input type="text" name="note" maxlength="200"></div>

    if (!t || !al) return { msg: 'Chọn chuyến và điểm xuống.' };
    const at = s => eff(t) + (t.direction === 'di' ? s.offset_min : tot - s.offset_min);
    if (flag) {
      const la = parseFloat(f.get('plat')), ln = parseFloat(f.get('plng'));
      if (isNaN(la) || isNaN(ln)) return { msg: 'Chọn điểm đón trên bản đồ để tính giá.' };

    return { fare: fareOf(r, seats), info: `Xe tới điểm lên dự kiến ${hhmm(at(bo))}, tới điểm xuống ${hhmm(at(al))}` };
  };

  }

    e.preventDefault(); const c = calc(); if (!c.fare) return toast(c.msg, true);
    const f = new FormData(e.target), row = { trip_id: +f.get('trip'), alight_stop_id: +f.get('to'), seats: +f.get('seats'), pay_method: f.get('pay'), note: f.get('note').trim() || null };

    }
    const { error } = await sb.from('bookings').insert(row);
    if (error) return toast('Đặt chỗ thất bại: ' + error.message, true);
    if (S.user) { d.close(); toast('Đặt chỗ thành công. Số tiền: ' + money(c.fare)); location.hash = '#me'; return load(); }

    <div class="f"><label>Số điện thoại</label><input type="text" name="phone" value="${esc(m.phone)}" inputmode="tel" placeholder="0901234567"></div>
    <div class="f"><label>Địa chỉ</label><input type="text" name="address" value="${esc(m.address)}" maxlength="200"></div>
    ${drv ? `<div class="f"><label>Số giấy phép lái xe</label><input type="text" name="license_no" value="${esc(m.license_no)}" maxlength="30"></div>` : ''}
    <div class="acts"><button class="btn pri">Lưu thông tin</button></div></form></section>
    <section class="panel" style="margin-top:16px"><h3>Chuyến đã đặt</h3>
    ${mine.length ? '<div class="scroll"><table class="rtable"><thead><tr><th>Tuyến</th><th>Chuyến</th><th>Xe</th><th>Xuống tại</th><th>Ghế</th><th>Số tiền</th><th>Thanh toán</th><th></th></tr></thead><tbody>' + mine.map(b => {
      const t = S.trips.find(x => x.id === b.trip_id), r = S.routes.find(x => x.id === t?.route_id), al = S.stops.find(s => s.id === b.alight_stop_id);
      return `<tr><td data-l="Tuyến">${esc(r?.code)}${r && isFlag(r) ? ' (đón dọc đường)' : ''}</td><td data-l="Chuyến">${t5(t?.departure)} · ${t ? DIR[t.direction] : ''}${t?.delay_min >= 3 ? ' · trễ ' + t.delay_min + ' phút' : ''}</td><td data-l="Xe">${esc(plateOf(t?.bus_id))}</td>
      <td data-l="Xuống tại">${esc(al?.name)}</td><td data-l="Ghế">${b.seats}</td><td data-l="Số tiền"><b>${money(b.fare)}</b></td><td data-l="Thanh toán">${PM[b.pay_method]} · ${PAY[b.pay_status]}</td>
      <td>${b.pay_status === 'unpaid' ? `<button class="btn sm del" data-cancel="${b.id}">Huỷ</button>` : ''}</td></tr>`;
    }).join('') + '</tbody></table></div>' : '<p class="muted">Bạn chưa đặt chuyến nào. Vào một tuyến ở trang chủ và chọn “Đặt chỗ”.</p>'}
    <p class="muted" style="font-size:13px;margin-top:8px">Trạng thái “Đã thanh toán” do quản trị viên cập nhật sau khi nhận tiền.</p></section>
    ${drv ? `<section class="panel" style="margin-top:16px"><h3>Chuyến của tôi${bus ? ' · xe ' + esc(bus.plate) : ''}</h3>
    ${!m.bus_id ? '<p class="muted">Bạn chưa được gán xe. Liên hệ quản trị viên để được gán xe và xem chuyến.</p>'
      : !trips.length ? '<p class="muted">Xe này chưa có chuyến nào.</p>'
      : '<div class="scroll"><table class="rtable"><thead><tr><th>Giờ</th><th>Tuyến</th><th>Hướng</th><th>Ghế đã đặt</th><th>Trạng thái</th><th>Trễ</th></tr></thead><tbody>' + trips.map(t => {
        const r = S.routes.find(x => x.id === t.route_id), opt = (o, v) => o.map(([k, l]) => `<option value="${k}" ${String(k) === String(v) ? 'selected' : ''}>${l}</option>`).join('');
        return `<tr><td data-l="Giờ"><b>${t5(t.departure)}</b></td><td data-l="Tuyến">${esc(r?.code)}</td><td data-l="Hướng">${DIR[t.direction]}</td><td data-l="Ghế đã đặt">${seatsOf(t.id)}</td>
        <td data-l="Trạng thái"><select data-trip="${t.id}" aria-label="Trạng thái chuyến ${t5(t.departure)}">${opt(Object.entries(STATUS), t.status)}</select></td>
        <td data-l="Trễ"><select data-delay="${t.id}" aria-label="Phút trễ chuyến ${t5(t.departure)}">${opt([0, 5, 10, 15, 20, 30].map(x => [x, x + ' phút']), t.delay_min)}</select></td></tr>`;
      }).join('') + '</tbody></table></div>'}</section>` : ''}`;
}
$('#me').onsubmit = async e => {
  e.preventDefault(); const f = new FormData(e.target), o = {};
  for (const [k, v] of f.entries()) o[k] = v.trim() || null;
  if (!o.full_name) return toast('Vui lòng nhập họ và tên.', true);
  if (o.phone && !PHONE.test(o.phone)) return toast('Số điện thoại không hợp lệ (8–15 chữ số).', true);
  const { error } = await sb.from('profiles').update(o).eq('id', S.user.id);
  error ? toast('Lưu thất bại: ' + error.message, true) : (toast('Đã lưu thông tin.'), load());
};
$('#me').onchange = async e => {
  const t = e.target, id = +(t.dataset.trip || t.dataset.delay); if (!id) return;
  const cur = S.trips.find(x => x.id === id), v = t.dataset.trip ? { status: t.value }
    : { delay_min: +t.value, status: +t.value >= 5 ? 'delayed' : cur?.status === 'delayed' ? 'scheduled' : cur?.status };
  const { data, error } = await sb.from('trips').update(v).eq('id', id).select();
  if (error || !data?.length) toast('Không cập nhật được chuyến này.', true); else toast('Đã cập nhật.');
  load();
};
$('#me').onclick = async e => {
  const b = e.target.closest('[data-cancel]'); if (!b) return;
  const { error } = await sb.from('bookings').delete().eq('id', +b.dataset.cancel);
  error ? toast('Không huỷ được: ' + error.message, true) : (toast('Đã huỷ đặt chỗ.'), load());
};

/* ---------- Bản đồ (Leaflet + OpenStreetMap, đường đi theo OSRM) ---------- */
let map = null, MK = {}, tok = 0; const RC = {};
const TILE = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png', HCM = [10.7769, 106.7009];
const pin = t => L.divIcon({ className: '', html: `<div class="pin">${t}</div>`, iconSize: [24, 24], iconAnchor: [12, 12] });
function drawMap(st) {
  if (map) { map.remove(); map = null; } MK = {};
  const el = $('#map'); if (!el) return;
  if (typeof L === 'undefined') { el.textContent = 'Không tải được thư viện bản đồ.'; return; }
  const my = ++tok; map = L.map(el, { scrollWheelZoom: false });
  L.tileLayer(TILE, { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(map);
  const pts = st.filter(s => s.lat != null && s.lng != null);
  if (!pts.length) { map.setView(HCM, 12); return; }
  const ll = pts.map(s => [s.lat, s.lng]);
  const line = L.polyline(ll, { color: '#1b8a5a', weight: 4, dashArray: '6 8' }).addTo(map);
  pts.forEach(s => MK[s.id] = L.marker([s.lat, s.lng], { icon: pin(s.seq) }).bindPopup(esc(s.name)).addTo(map));
  map.fitBounds(ll, { padding: [24, 24] });
  if (pts.length > 1) roadPath(ll).then(g => { if (my === tok) line.setLatLngs(g).setStyle({ dashArray: null, weight: 5 }); }).catch(() => {});
}
async function roadPath(ll) {
  const key = ll.join(';'); if (RC[key]) return RC[key];
  const u = 'https://router.project-osrm.org/route/v1/driving/' + ll.map(p => p[1] + ',' + p[0]).join(';') + '?overview=full&geometries=geojson';
  const j = await (await fetch(u)).json(); if (j.code !== 'Ok') throw 0;
  return RC[key] = j.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
}
function initPick(fs = '#frm', a = 'lat', b = 'lng', c = HCM) {
  if (typeof L === 'undefined') return;
  $(fs + ' .acts').insertAdjacentHTML('beforebegin', '<p class="muted" style="font-size:13px;margin-bottom:4px">Bấm vào bản đồ để chọn vị trí.</p><div id="pick"></div>');
  const la = $(fs + ' [name=' + a + ']'), ln = $(fs + ' [name=' + b + ']'), has = la.value && ln.value;
  const m = L.map('pick').setView(has ? [+la.value, +ln.value] : c, has ? 16 : 13);
  L.tileLayer(TILE, { maxZoom: 19, attribution: '&copy; OpenStreetMap' }).addTo(m);
  let mk = null;
  const put = (lat, lng, fly) => {
    la.value = (+lat).toFixed(6); ln.value = (+lng).toFixed(6);
    mk ? mk.setLatLng([lat, lng]) : mk = L.marker([lat, lng], { icon: pin('•') }).addTo(m);
    if (fly) m.setView([lat, lng], 16);
    la.dispatchEvent(new Event('input', { bubbles: true }));
  };
  if (has) put(+la.value, +ln.value);
  m.on('click', e => put(e.latlng.lat, e.latlng.lng));
  setTimeout(() => m.invalidateSize(), 60);
  return put;
}
$('#detail').onclick = e => {
  if (e.target.id === 'bookBtn') return openBook();
  const li = e.target.closest('[data-sid]'), m = li && MK[li.dataset.sid];
  if (m) { map.setView(m.getLatLng(), 16); m.openPopup(); }
};

/* ---------- Sự kiện ---------- */
function render() {
  renderAuth();
  if (!$('#pub').hidden) { renderBoard(); renderList(); renderDetail(); }
  if (!$('#adm').hidden) renderAdmin();
  if (!$('#me').hidden) renderMe();
}
$('#q').oninput = e => { S.q = e.target.value; renderList(); };
$('#dir').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.dir = b.dataset.d; [...$('#dir').children].forEach(x => x.classList.toggle('on', x === b)); renderList(); renderDetail(); };
$('#typ').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.type = b.dataset.t; [...$('#typ').children].forEach(x => x.classList.toggle('on', x === b)); renderList(); };
$('#rlist').onclick = e => { const b = e.target.closest('.ritem'); if (b) { S.sel = +b.dataset.id; renderList(); renderDetail(); } };
$('#tabs').onclick = e => { const b = e.target.closest('button'); if (b) { S.tab = b.dataset.t; renderAdmin(); } };
$('#addBtn').onclick = () => openForm(null);
$('#atable').onclick = e => {
  const t = e.target.closest('button'); if (!t) return;
  const find = id => S[S.tab].find(x => x.id === +id);
  if (t.dataset.edit) openForm(find(t.dataset.edit));
  else if (t.dataset.del) confirmDel(find(t.dataset.del));
  else if (t.dataset.mv) move(+t.dataset.id, +t.dataset.mv);
};
$('#auth').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'lookup') return ok ? openLookup() : toast('Chưa cấu hình Supabase.', true);
  if (b.dataset.go) location.hash = b.dataset.go;
  if (b.id === 'in') ok ? openLogin(false) : toast('Chưa cấu hình Supabase.', true);
  if (b.id === 'out') { await sb.auth.signOut(); location.hash = ''; }
};
$('.brand').onclick = () => { location.hash = ''; render(); };
addEventListener('hashchange', render);
setInterval(() => { if (!$('#pub').hidden) renderBoard(); }, 30000);

if (ok) {
  sb.auth.onAuthStateChange((_, ses) => { S.user = ses?.user ?? null; if (!S.user) S.me = null; setTimeout(load, 0); });
  sb.channel('trips-live').on('postgres_changes', { event: '*', schema: 'public', table: 'trips' }, load).subscribe();
} else load();
</script>
